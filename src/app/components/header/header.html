<header
  [class]="isDarkMode() ? 'bg-[#03256c]/90 border-[#1768ac]/60' : 'bg-white/90 border-[#1768ac]/20 shadow-sm'"
  class="sticky top-0 z-50 backdrop-blur-md border-b py-3.5 transition-all duration-300"
>
  <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 flex items-center justify-between gap-4">
    <!-- Left Logo / Brand: Sarfaroj Board -->
    <div class="flex items-center gap-2.5">
      <div class="h-9 w-9 rounded-lg bg-gradient-to-tr from-[#2541b2] to-[#06bee1] flex items-center justify-center shadow-md shadow-[#06bee1]/20 border border-[#06bee1]/30">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      <span [class]="isDarkMode() ? 'text-white' : 'text-[#03256c]'" class="text-lg font-bold tracking-tight transition-colors">
        Sarfaroj Board
      </span>
    </div>

    <!-- Right Header Actions: Theme Toggle & Sign Out -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- Dark / Light Mode Toggle Button -->
      <button
        type="button"
        (click)="onToggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        [class]="isDarkMode() ? 'bg-[#2541b2]/40 border-[#1768ac] text-[#06bee1] hover:bg-[#2541b2]/70 hover:border-[#06bee1]' : 'bg-slate-200/80 border-slate-300 text-[#2541b2] hover:bg-slate-300/80 hover:border-[#2541b2]'"
        class="relative inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs font-semibold transition-all duration-200 shadow-sm cursor-pointer group"
      >
        @if (isDarkMode()) {
          <!-- Moon Icon (Dark Mode Active) -->
          <svg class="w-4 h-4 text-[#06bee1] transition-transform duration-200 group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
          <span class="hidden sm:inline text-white">Dark</span>
        } @else {
          <!-- Sun Icon (Light Mode Active) -->
          <svg class="w-4 h-4 text-amber-500 transition-transform duration-200 group-hover:rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <span class="hidden sm:inline text-[#03256c]">Light</span>
        }
      </button>

      <!-- Sign Out Button -->
      <button
        type="button"
        (click)="onLogout()"
        [class]="
          isDarkMode()
            ? 'bg-red-500/15 border-red-500/30 text-red-300 hover:bg-red-500/25 hover:border-red-400'
            : 'bg-red-50 border-red-200 text-red-600 hover:bg-red-100'
        "
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-semibold shadow-sm transition-all cursor-pointer"
        title="Sign Out"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</header>
